[metadata]
name = rgc_tools
version = attr: rgc_tools.__version__
description = Combine MaxLab raw recordings with SpyKING CIRCUS sorted spikes into one analysis-ready HDF5 file, and check it
long_description = file: README.md
long_description_content_type = text/markdown
author = Baccus Lab
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.7
install_requires =
    numpy
    h5py
    matplotlib

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    rgc-build-dataset = rgc_tools.build_dataset:main
    rgc-check-dataset = rgc_tools.check_dataset:main
    rgc-raster = rgc_tools.raster:main
